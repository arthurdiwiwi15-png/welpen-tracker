name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Install Cordova and build APK
      run: |
        npm install -g cordova
        cordova create myapp com.example.welpentracker WelpenTracker
        cp index.html style.css app.js manifest.json myapp/www/
        cd myapp
        cordova platform add android
        cordova build android
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: welpen-tracker-apk
        path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
